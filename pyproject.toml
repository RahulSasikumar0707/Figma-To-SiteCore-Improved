[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "figma-to-sitecore"
version = "2.0.0"
description = "Convert Figma nodes into responsive Sitecore EDS components with LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Figma to Sitecore team" }]
dependencies = [
  "httpx>=0.27,<1",
  "langchain>=1.1,<2",
  "langchain-anthropic>=1.0,<2",
  "langgraph>=1.0,<2",
  "mcp>=1.15,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
visual = [
  "pillow>=11,<13",
  "playwright>=1.48,<2",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
figma-sitecore = "figma_to_sitecore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/figma_to_sitecore"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["figma_to_sitecore"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["PIL.*", "playwright.*"]
ignore_missing_imports = true
